name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: audit · corpus · integrity · manifest · leak-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S error scripts/*.sh   # yalnız gerçek hatalar; stil uyarıları kapı değil

      - name: Audit — every skill must return 0
        run: |
          fail=0
          for d in skills/*/ vendor/*/; do
            [ -f "$d/SKILL.md" ] || continue
            if ! bash scripts/skill-audit.sh "$d" >/dev/null 2>&1; then echo "::error::audit rc≠0: $d"; fail=1; fi
          done
          exit $fail

      - name: Audit regression corpus — malicious samples must fail, benign must pass
        run: bash scripts/test-audit.sh

      - name: Audit strict mode report (exceptions ignored, informational)
        run: |
          for d in vendor/*/; do
            n=$(bash scripts/skill-audit.sh --no-allow "$d" 2>&1 | grep -cE "^\s{6}\S" || true)
            echo "$n raw findings — $(basename "$d")"
          done

      - name: Vendor integrity — files must match INTEGRITY.sha256
        run: bash scripts/verify-integrity.sh

      - name: Manifest freshness — regenerated files must equal committed ones
        run: |
          bash scripts/gen-manifest.sh >/dev/null
          git diff --exit-code -- vendor/MANIFEST.md vendor/INTEGRITY.sha256 \
            || { echo "::error::vendor/MANIFEST.md or INTEGRITY.sha256 is stale — run scripts/gen-manifest.sh and commit"; exit 1; }

      - name: Leak scan (generic patterns; org names live in the untracked publish-check.local)
        run: bash scripts/publish-check.sh

      - name: Install smoke test — --only with deps into a temp dir
        run: |
          SKILLS_DEST="$RUNNER_TEMP/skills" bash scripts/install.sh --only ux-a11y-review --with-deps
          test -f "$RUNNER_TEMP/skills/ux-a11y-review/SKILL.md"
          test -f "$RUNNER_TEMP/skills/heuristic-evaluation/SKILL.md"
