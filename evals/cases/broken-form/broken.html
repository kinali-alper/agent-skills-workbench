<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Öğrenci Kayıt (hatalı, düz HTML)</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0; padding: 24px; max-width: 640px; }
    input, select { display: block; margin: 8px 0; padding: 6px; }
    .fake-btn { display: inline-block; padding: 8px 16px; background: #2b6cb0; color: #fff; border-radius: 4px; cursor: pointer; }
    .icon-only { background: none; border: 0; font-size: 18px; }
    .pulse { display: inline-block; padding: 2px 8px; background: #e53e3e; color: #fff; border-radius: 999px; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.15) } }
  </style>
</head>
<body>
  <div style="font-size:28px;font-weight:700">Öğrenci Kayıt</div>
  <img src="https://picsum.photos/seed/okul/320/120" width="320" height="120">
  <p style="color:#9a9a9a;background:#fff">Lütfen tüm alanları doldurun. Zorunlu alanlar kırmızı ile işaretlidir.</p>
  <input type="text" placeholder="Ad Soyad">
  <input type="email" placeholder="E-posta">
  <input type="text" placeholder="TC Kimlik No" style="border:2px solid red">
  <select style="outline:none">
    <option value="" disabled selected>Sınıf seçin</option>
    <option>5. Sınıf</option>
    <option>6. Sınıf</option>
  </select>
  <div class="fake-btn" onclick="alert('kaydedildi')">Kaydet</div>
  <button class="icon-only">🗑</button>
  <a href="#sil" style="display:inline-block;width:16px;height:16px;font-size:10px;line-height:16px">x</a>
  <div class="pulse">Yeni!</div>
  <table>
    <tr><td>Matematik</td><td>85</td></tr>
    <tr><td>Türkçe</td><td>92</td></tr>
  </table>
  <a href="#detay">buraya tıklayın</a>
</body>
</html>
